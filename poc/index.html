<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cheky prueba">
<title>Cheky · prueba del celular</title>
<style>
  :root { --ink: #14213d; --muted: #5a6577; --line: #dce1ea; --card: #fff; --bg: #f5f6f9; --pri: #1f5fbf;
          --ok: #1d7a46; --okbg: #e4f4ea; --warn: #8a5a00; --warnbg: #fdf1d8; --err: #b42318; --errbg: #fde8e6; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 24px; margin: 4px 0 2px; }
  .muted { color: var(--muted); font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin: 12px 0; }
  .paso { display: flex; gap: 12px; align-items: flex-start; }
  .ic { flex: none; width: 26px; height: 26px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; background: #e9edf3; color: var(--muted); }
  .ic.ok { background: var(--okbg); color: var(--ok); }
  .ic.aviso { background: var(--warnbg); color: var(--warn); }
  .ic.mal { background: var(--errbg); color: var(--err); }
  .paso b { display: block; }
  .paso .det { font-size: 14px; color: var(--muted); word-break: break-word; }
  button { font: inherit; font-weight: 600; width: 100%; padding: 14px; border-radius: 10px; border: 0; background: var(--pri); color: #fff; margin-top: 10px; }
  button.sec { background: #fff; color: var(--pri); border: 1px solid var(--pri); }
  button:disabled { opacity: .55; }
  video, img.foto { width: 100%; max-width: 320px; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 12px; background: #0b1324; display: block; margin: 10px auto 0; transform: scaleX(-1); }
  img.foto { transform: none; }
  input[type=text] { width: 100%; font: inherit; font-size: 16px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; margin-top: 6px; }
  .veredicto { border-radius: 14px; padding: 16px; margin: 16px 0 4px; font-weight: 600; }
  .veredicto.ok { background: var(--okbg); color: var(--ok); }
  .veredicto.aviso { background: var(--warnbg); color: var(--warn); }
  .veredicto.mal { background: var(--errbg); color: var(--err); }
  .veredicto span { display: block; font-weight: 400; font-size: 14px; margin-top: 4px; color: var(--ink); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Prueba de este celular</h1>
  <div class="muted">Cheky · prueba de concepto · v1.0</div>

  <div class="card" id="lista"></div>

  <div class="card" id="zona-camara" hidden>
    <b>Cámara</b>
    <div class="muted" id="cam-nota">Se toma una foto de prueba. No se guarda: solo se comprueba que llega completa.</div>
    <video id="video" playsinline autoplay muted hidden></video>
    <img class="foto" id="foto" alt="Foto de prueba" hidden>
    <button id="btn-foto" hidden>Tomar foto de prueba</button>
  </div>

  <button id="btn-iniciar">Iniciar prueba</button>

  <div id="final" hidden>
    <div class="veredicto" id="veredicto"></div>
    <div class="card">
      <label for="quien"><b>¿Quién hizo la prueba?</b></label>
      <input type="text" id="quien" maxlength="60" placeholder="Nombre o número de empleado" autocomplete="off">
      <button id="btn-enviar">Enviar resultado</button>
      <button class="sec" id="btn-copiar">Copiar resultado</button>
      <div class="muted" id="envio-nota" style="margin-top:8px"></div>
    </div>
  </div>
</main>
<script src="config.js"></script>
<script>
(function () {
  'use strict';
  const $ = s => document.querySelector(s);
  const API = window.CHEKY_API || '';
  const R = {};            // resultados por paso
  const D = {};            // datos para el reporte
  const PASOS = [
    ['entorno', 'Navegador y página'],
    ['conexion', 'Conexión con el servidor'],
    ['almacen', 'Celular recordado (amarre)'],
    ['traspaso', 'Traspaso desde la dirección vieja'],
    ['ubicacion', 'Ubicación'],
    ['camara', 'Cámara en vivo'],
    ['galeria', 'Fotos de la galería']
  ];
  const ICONO = { ok: '✓', aviso: '!', mal: '✗', pend: '…' };
  function pintar() {
    $('#lista').innerHTML = PASOS.map(([k, t]) => {
      const r = R[k] || { nivel: 'pend', txt: 'Pendiente' };
      return `<div class="paso" style="margin:8px 0"><span class="ic ${r.nivel}">${ICONO[r.nivel]}</span>
        <div><b>${t}</b><div class="det">${esc(r.txt)}</div></div></div>`;
    }).join('');
  }
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const poner = (k, nivel, txt) => { R[k] = { nivel, txt }; pintar(); };

  // ---------- utilidades
  function navegadorEnApp(ua) {
    const apps = [[/WhatsApp/i, 'WhatsApp'], [/FBAN|FBAV|FB_IAB|FBIOS|FB4A/i, 'Facebook'], [/Instagram/i, 'Instagram'],
      [/Messenger|Orca-Android/i, 'Messenger'], [/musical_ly|BytedanceWebview|TikTok/i, 'TikTok'], [/Telegram/i, 'Telegram'], [/GSA\//i, 'la app de Google']];
    for (const [re, n] of apps) if (re.test(ua)) return n;
    if (/Android/i.test(ua) && /; wv\)/.test(ua)) return 'otra app';
    return null;
  }
  function navegador(ua) {
    const so = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1) ? 'iPhone' : /Android/i.test(ua) ? 'Android' : 'computadora';
    const app = navegadorEnApp(ua);
    const nav = app || (/SamsungBrowser/i.test(ua) ? 'Samsung Internet' : /EdgA?\/|EdgiOS/i.test(ua) ? 'Edge' : /Firefox|FxiOS/i.test(ua) ? 'Firefox' : /CriOS|Chrome\//i.test(ua) ? 'Chrome' : /Safari\//i.test(ua) ? 'Safari' : 'Desconocido');
    return { so, nav, app };
  }
  const nuevoId = () => (crypto.randomUUID ? crypto.randomUUID()
    : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = crypto.getRandomValues(new Uint8Array(1))[0] & 15; return (c === 'x' ? r : (r & 3) | 8).toString(16); }));
  const codigo = id => String(id).replace(/-/g, '').slice(0, 8).toUpperCase();
  const hex = buf => Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  async function api(accion, extra) {
    if (!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(API) && !/^http:\/\/(127\.0\.0\.1|localhost):\d+\/.+\/exec$/.test(API)) throw new Error('Falta configurar la URL del servidor en config.js.');
    const resp = await fetch(API, {
      method: 'POST', redirect: 'follow',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ accion }, extra || {}))
    });
    if (!resp.ok) throw new Error('El servidor respondió ' + resp.status + '.');
    const j = await resp.json();
    if (!j.ok) throw new Error(j.error || 'Error del servidor.');
    return j.data;
  }

  // ---------- pasos automáticos
  function pasoEntorno() {
    const ua = navigator.userAgent;
    const n = navegador(ua);
    const top = (() => { try { return window.top === window.self; } catch (e) { return false; } })();
    const directo = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
    Object.assign(D, { plataforma: n.so, navegador: n.nav, dominio: location.hostname, top_level: top ? 'SI' : 'NO', acceso_directo: directo ? 'SI' : 'NO', user_agent: ua });
    const base = `${n.nav} en ${n.so} · ${location.hostname}` + (directo ? ' · desde acceso directo' : '');
    if (!top) poner('entorno', 'mal', base + ' · la página está dentro de un marco: así no funciona el plan B.');
    else if (n.app) poner('entorno', 'aviso', base + `. Está abierta dentro de ${n.app}: ábrela en ${n.so === 'iPhone' ? 'Safari' : 'Chrome'}.`);
    else if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') poner('entorno', 'mal', base + ' · sin HTTPS no hay cámara ni ubicación.');
    else poner('entorno', 'ok', base);
  }
  async function pasoConexion() {
    const t0 = performance.now();
    try {
      const r = await api('ping');
      const ms = Math.round(performance.now() - t0);
      D.conexion_ms = ms;
      poner('conexion', ms > 6000 ? 'aviso' : 'ok', `Responde en ${(ms / 1000).toFixed(1)} s · servidor v${r.version}`);
    } catch (e) {
      D.conexion_ms = 'ERROR: ' + e.message;
      poner('conexion', 'mal', e.message);
    }
  }
  async function pasoAlmacen() {
    let id, creado, nuevo = false;
    try {
      id = localStorage.getItem('cheky_disp');
      creado = localStorage.getItem('cheky_disp_ts');
      if (!id) { id = nuevoId(); creado = new Date().toISOString(); localStorage.setItem('cheky_disp', id); localStorage.setItem('cheky_disp_ts', creado); nuevo = true; }
      if (localStorage.getItem('cheky_disp') !== id) throw new Error('no se guardó');
    } catch (e) {
      D.almacen = 'NO'; poner('almacen', 'mal', 'Este navegador no deja guardar datos (¿modo privado?). Así el celular no se puede recordar.'); return;
    }
    let pers = 'sin dato';
    try {
      if (navigator.storage && navigator.storage.persist) {
        let p = await navigator.storage.persisted();
        if (!p) p = await navigator.storage.persist();
        pers = p ? 'SI' : 'NO';
      }
    } catch (e) { /* sin soporte */ }
    const dias = Math.floor((Date.now() - new Date(creado).getTime()) / 86400000);
    Object.assign(D, { almacen: 'SI', persistente: pers, id_creado: creado });
    poner('almacen', 'ok', nuevo
      ? `Código ${codigo(id)} creado ahora. Vuelve a abrir esta página en unos días: debe mostrar el mismo código.`
      : `Código ${codigo(id)}, guardado hace ${dias} día${dias === 1 ? '' : 's'}: el celular sí se recuerda.`);
  }
  function pasoTraspaso() {
    const m = /[#&]traspaso=([^&]+)/.exec(location.hash);
    if (m) {
      const id = decodeURIComponent(m[1]);
      try { localStorage.setItem('cheky_traspaso', id); } catch (e) { /* ya se reportó en almacén */ }
      history.replaceState(null, '', location.pathname + location.search);
      D.traspaso = 'RECIBIDO ' + codigo(id);
      poner('traspaso', 'ok', `Llegó el código ${codigo(id)} desde la página del marco de Google. El día del cambio nadie tendría que reautorizar su celular.`);
      return;
    }
    let previo = null;
    try { previo = localStorage.getItem('cheky_traspaso'); } catch (e) { /* nada */ }
    D.traspaso = previo ? 'RECIBIDO ANTES ' + codigo(previo) : 'NO PROBADO';
    poner('traspaso', previo ? 'ok' : 'aviso', previo ? `Ya se había recibido el código ${codigo(previo)}.` : 'No probado en esta visita: ábrela desde el enlace de traspaso.');
  }

  // ---------- pasos con permiso (después de tocar «Iniciar prueba»)
  function pasoUbicacion() {
    return new Promise(res => {
      if (!navigator.geolocation) { D.ubicacion = 'NO'; poner('ubicacion', 'mal', 'Este navegador no ofrece ubicación.'); return res(); }
      poner('ubicacion', 'pend', 'Pidiendo permiso…');
      navigator.geolocation.getCurrentPosition(p => {
        const prec = Math.round(p.coords.accuracy);
        Object.assign(D, { ubicacion: 'SI', precision_m: prec });
        poner('ubicacion', prec > 150 ? 'aviso' : 'ok', `Precisión de ${prec} m` + (prec > 150 ? ' (baja: activa la ubicación precisa del celular).' : ''));
        res();
      }, e => {
        D.ubicacion = 'NO: ' + (e.code === 1 ? 'permiso negado' : e.message);
        poner('ubicacion', 'mal', e.code === 1 ? 'Permiso negado. Actívalo en los ajustes del navegador para este sitio.' : 'No se obtuvo: ' + e.message);
        res();
      }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
    });
  }
  let flujo = null;
  async function pasoCamara() {
    $('#zona-camara').hidden = false;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      D.camara = 'NO: sin getUserMedia'; poner('camara', 'mal', 'Este navegador no permite la cámara en vivo.'); return;
    }
    poner('camara', 'pend', 'Pidiendo permiso…');
    try {
      flujo = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, audio: false });
    } catch (e) {
      const negado = e && (e.name === 'NotAllowedError' || e.name === 'SecurityError');
      D.camara = 'NO: ' + (e && e.name || 'error');
      poner('camara', 'mal', negado ? 'Permiso negado. En el iPhone: Ajustes › Safari › Cámara › Permitir. En Android: candado de la barra de dirección › Permisos.' : 'No se pudo abrir la cámara: ' + (e && e.message || e));
      return;
    }
    const v = $('#video');
    v.srcObject = flujo; v.hidden = false;
    await new Promise(r => { if (v.readyState >= 2) r(); else v.onloadeddata = () => r(); setTimeout(r, 4000); });
    poner('camara', 'pend', 'Cámara abierta. Toca «Tomar foto de prueba».');
    $('#btn-foto').hidden = false;
    await new Promise(res => { $('#btn-foto').onclick = res; });
    $('#btn-foto').disabled = true; $('#btn-foto').textContent = 'Enviando…';
    const ancho = 320, alto = Math.round(ancho * (v.videoHeight || 480) / (v.videoWidth || 640));
    const c = document.createElement('canvas'); c.width = ancho; c.height = alto;
    c.getContext('2d').drawImage(v, 0, 0, ancho, alto);
    flujo.getTracks().forEach(t => t.stop());
    const dataUrl = c.toDataURL('image/jpeg', 0.6);
    v.hidden = true; $('#foto').src = dataUrl; $('#foto').hidden = false; $('#btn-foto').hidden = true;
    const bin = Uint8Array.from(atob(dataUrl.split(',')[1]), ch => ch.charCodeAt(0));
    const shaLocal = hex(await crypto.subtle.digest('SHA-256', bin));
    try {
      const r = await api('eco', { foto: dataUrl });
      const igual = r.sha256 === shaLocal && r.bytes === bin.length;
      Object.assign(D, { camara: 'SI', foto_bytes: r.bytes, foto_sha_ok: igual ? 'SI' : 'NO' });
      poner('camara', igual ? 'ok' : 'mal', igual ? `Foto en vivo de ${(r.bytes / 1024).toFixed(0)} KB enviada y recibida completa (huella idéntica).` : 'La foto llegó alterada: la huella no coincide.');
    } catch (e) {
      Object.assign(D, { camara: 'SI', foto_sha_ok: 'ERROR: ' + e.message });
      poner('camara', 'mal', 'La cámara funciona, pero la foto no llegó al servidor: ' + e.message);
    }
  }

  function veredicto() {
    const niveles = PASOS.map(([k]) => (R[k] || {}).nivel);
    const criticos = ['entorno', 'conexion', 'almacen', 'camara'].map(k => (R[k] || {}).nivel);
    const v = criticos.includes('mal') ? 'mal' : niveles.includes('mal') || niveles.includes('aviso') ? 'aviso' : 'ok';
    const titulo = { ok: 'Listo: este celular funcionará con el plan B', aviso: 'Funciona, con observaciones', mal: 'No funcionaría así' }[v];
    const nota = { ok: 'Cámara en vivo, sin galería y con el celular recordado.', aviso: 'Revisa los puntos en amarillo o rojo.', mal: 'Revisa los puntos en rojo y repite la prueba.' }[v];
    D.veredicto = v.toUpperCase();
    $('#veredicto').className = 'veredicto ' + v;
    $('#veredicto').innerHTML = esc(titulo) + `<span>${esc(nota)}</span>`;
    $('#final').hidden = false;
  }
  function textoResultado() {
    return ['Cheky · prueba del celular v1.0', ...PASOS.map(([k, t]) => `${ICONO[(R[k] || {}).nivel || 'pend']} ${t}: ${(R[k] || {}).txt || 'Pendiente'}`),
      'Veredicto: ' + (D.veredicto || ''), 'Navegador: ' + navigator.userAgent].join('\n');
  }

  // ---------- arranque
  pintar();
  pasoEntorno();
  pasoTraspaso();
  poner('galeria', 'ok', 'Esta página no ofrece elegir fotos guardadas: solo la cámara en vivo.');
  pasoAlmacen();
  pasoConexion();

  $('#btn-iniciar').addEventListener('click', async () => {
    const b = $('#btn-iniciar'); b.disabled = true; b.textContent = 'Probando…';
    await pasoUbicacion();
    await pasoCamara();
    b.hidden = true;
    veredicto();
  });
  $('#btn-enviar').addEventListener('click', async () => {
    const b = $('#btn-enviar'); b.disabled = true; b.textContent = 'Enviando…';
    D.quien = $('#quien').value.trim();
    D.detalle = PASOS.map(([k]) => k + ': ' + ((R[k] || {}).txt || '')).join(' | ');
    try {
      await api('reporte', { datos: D });
      b.textContent = 'Resultado enviado ✓';
      $('#envio-nota').textContent = 'Gracias. El resultado llegó a la hoja de pruebas.';
    } catch (e) {
      b.disabled = false; b.textContent = 'Enviar resultado';
      $('#envio-nota').textContent = 'No se pudo enviar (' + e.message + '). Usa «Copiar resultado» y mándalo por WhatsApp.';
    }
  });
  $('#btn-copiar').addEventListener('click', async () => {
    const t = textoResultado();
    try { await navigator.clipboard.writeText(t); $('#envio-nota').textContent = 'Copiado. Pégalo en WhatsApp.'; }
    catch (e) {
      const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); $('#envio-nota').textContent = 'Copiado. Pégalo en WhatsApp.'; } catch (e2) { $('#envio-nota').textContent = t; }
      ta.remove();
    }
  });
})();
</script>
</body>
</html>
